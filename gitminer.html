<!doctype html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Miner</title>

    <!-- Loaded in <head> on purpose: the top of app.js applies the saved
         theme before the body is parsed. The rest of it waits for
         DOMContentLoaded, so nothing here touches the body early. -->
    <script src="assets/js/app.js"></script>

    <style>
        /* ---------------------------------------------------------------
           Tokens
           --------------------------------------------------------------- */
        /* Every colour is light-dark(light, dark) and resolves against the
           used color-scheme below, so the palette is defined exactly once. */
        :root {
            color-scheme: light dark;

            --radius: 2px;

            --bg: light-dark(#f7f7f8, #0d0d10);
            --surface: light-dark(#ffffff, #141417);
            --surface-sunken: light-dark(#f2f2f4, #1a1a1e);
            --border: light-dark(#e3e3e7, #26262b);
            --border-strong: light-dark(#c9c9cf, #3d3d45);
            --text: light-dark(#17171a, #ececf0);
            --text-soft: light-dark(#52525b, #b4b4bd);
            --muted: light-dark(#78787f, #85858f);
            --accent: light-dark(#1f5fd8, #6d9eff);
            --accent-soft: light-dark(#e8effc, #17233c);
            --star: light-dark(#a05a00, #d9a13b);
            --danger: light-dark(#b42318, #f97066);
        }

        /* data-theme is set on <html> before the body is painted; it pins the
           scheme, which also themes native widgets and scrollbars. The bare
           :root above only applies until then, so it follows the OS. */
        :root[data-theme="light"] {
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
        }

        /* ---------------------------------------------------------------
           Reset
           --------------------------------------------------------------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        h1,
        h2,
        p,
        ul,
        li {
            margin: 0;
            padding: 0;
        }

        ul,
        li {
            list-style: none;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            margin: 0;
            font: inherit;
            color: inherit;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter,
                "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .hidden {
            display: none !important;
        }

        /* ---------------------------------------------------------------
           Toolbar
           --------------------------------------------------------------- */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 32px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 14px 24px;
        }

        .title-section {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .site-title {
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .site-description {
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .filter-item {
            position: relative;
            min-width: 0;
        }

        .filter-label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .filter-button,
        .search-input,
        #date-jump {
            height: 34px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            transition: border-color 120ms linear, background-color 120ms linear;
        }

        .filter-button:hover,
        .search-input:hover,
        #date-jump:hover {
            border-color: var(--border-strong);
        }

        .filter-button:focus-visible,
        .search-input:focus,
        #date-jump:focus-visible {
            border-color: var(--accent);
        }

        #date-jump {
            appearance: none;
            width: 132px;
            padding-right: 26px;
            background-image:
                linear-gradient(45deg, transparent 50%, currentColor 50%),
                linear-gradient(135deg, currentColor 50%, transparent 50%);
            background-position: calc(100% - 14px) 15px, calc(100% - 10px) 15px;
            background-size: 4px 4px, 4px 4px;
            background-repeat: no-repeat;
            cursor: pointer;
        }

        #date-jump option {
            background: var(--surface);
            color: var(--text);
        }

        .filter-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 190px;
            cursor: pointer;
            text-align: left;
        }

        #language-filter-button span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chevron {
            width: 14px;
            height: 14px;
            flex: 0 0 auto;
            color: var(--muted);
            transition: transform 120ms linear;
        }

        #language-filter-button[aria-expanded="true"] .chevron {
            transform: rotate(180deg);
        }

        .search-container {
            width: 260px;
        }

        .search-input {
            width: 100%;
            padding-left: 32px;
            padding-right: 30px;
        }

        .search-input::placeholder {
            color: var(--muted);
        }

        .search-clear {
            position: absolute;
            top: 50%;
            right: 1px;
            display: grid;
            place-items: center;
            width: 28px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: var(--radius);
            background: none;
            color: var(--muted);
            cursor: pointer;
            transform: translateY(-50%);
            transition: color 120ms linear, background-color 120ms linear;
        }

        .search-clear:hover {
            background: var(--surface-sunken);
            color: var(--text);
        }

        .search-clear:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: -1px;
        }

        .search-clear svg {
            width: 13px;
            height: 13px;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 10px;
            display: grid;
            place-items: center;
            width: 14px;
            height: 14px;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .search-icon svg {
            width: 14px;
            height: 14px;
        }

        /* ---------------------------------------------------------------
           Theme toggle
           --------------------------------------------------------------- */
        .theme-toggle {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            background: var(--surface);
            color: var(--text-soft);
            cursor: pointer;
            transition: border-color 120ms linear, color 120ms linear;
        }

        .theme-toggle:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        .theme-toggle:focus-visible {
            border-color: var(--accent);
        }

        .theme-toggle svg {
            width: 15px;
            height: 15px;
        }

        /* The active icon is chosen in CSS so it is already correct on the
           first paint, before any script has run. */
        .theme-icon {
            display: none;
        }

        :root[data-theme="light"] .theme-icon--light,
        :root[data-theme="dark"] .theme-icon--dark {
            display: block;
        }

        /* ---------------------------------------------------------------
           Language multiselect
           --------------------------------------------------------------- */
        .multiselect-container {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 40;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1px;
            width: min(360px, calc(100vw - 48px));
            max-height: 320px;
            overflow-y: auto;
            padding: 6px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            background: var(--surface);
            scrollbar-width: thin;
        }

        .multiselect-container::-webkit-scrollbar {
            width: 8px;
        }

        .multiselect-container::-webkit-scrollbar-thumb {
            background: var(--border-strong);
        }

        .language-option {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            padding: 6px 8px;
            border-radius: var(--radius);
            color: var(--text-soft);
            font-size: 13px;
            cursor: pointer;
            transition: background-color 120ms linear, color 120ms linear;
        }

        .language-option:hover {
            background: var(--surface-sunken);
            color: var(--text);
        }

        .language-option:has(input:checked) {
            color: var(--text);
            font-weight: 500;
        }

        .multiselect-container input {
            appearance: none;
            display: grid;
            place-items: center;
            width: 14px;
            height: 14px;
            flex: 0 0 auto;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            background: var(--surface);
            cursor: pointer;
        }

        .multiselect-container input:checked {
            border-color: var(--accent);
            background: var(--accent);
        }

        .multiselect-container input:checked::before {
            content: "";
            width: 7px;
            height: 4px;
            border: solid var(--surface);
            border-width: 0 0 1.5px 1.5px;
            transform: rotate(-45deg) translate(0.5px, -1px);
        }

        /* ---------------------------------------------------------------
           Content
           --------------------------------------------------------------- */
        .page-shell {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 28px 24px 64px;
        }

        .content-batch + .content-batch {
            margin-top: 36px;
        }

        .date-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .date-head::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--border);
        }

        .date-pill {
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .repo-card {
            display: flex;
            flex-direction: column;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            transition: border-color 120ms linear;
        }

        .repo-card:hover {
            border-color: var(--border-strong);
        }

        .repo-card:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: -1px;
        }

        .repo-card__top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .owner-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .avatar-img {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            object-fit: cover;
            background: var(--surface-sunken);
        }

        .owner-pill span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .external-link {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 12px;
            opacity: 0;
            transition: opacity 120ms linear;
        }

        .repo-card:hover .external-link {
            opacity: 1;
        }

        .repo-card__title {
            margin-bottom: 6px;
            overflow-wrap: anywhere;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            transition: color 120ms linear;
        }

        .repo-card:hover .repo-card__title {
            color: var(--accent);
        }

        .repo-description {
            display: -webkit-box;
            min-height: 4.2em;
            margin-bottom: 14px;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            color: var(--text-soft);
            font-size: 13px;
            line-height: 1.45;
        }

        .repo-card__meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .meta-pill--stars {
            color: var(--star);
            font-weight: 500;
        }

        .language-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: var(--radius);
            background: var(--language-color, #94a3b8);
        }

        /* ---------------------------------------------------------------
           Empty / error / loading
           --------------------------------------------------------------- */
        .no-results,
        .quote-item {
            margin: 0 auto;
            max-width: 520px;
            padding: 28px 24px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-soft);
            font-size: 13px;
            text-align: center;
        }

        .no-results {
            grid-column: 1 / -1;
        }

        .quote-item {
            margin-top: 48px;
        }

        .no-results strong,
        .quote-item strong {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        .error-quote strong {
            color: var(--danger);
        }

        .loading-more {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 28px auto 0;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .spinner {
            position: relative;
            width: 120px;
            height: 2px;
            overflow: hidden;
            background: var(--border);
        }

        .spinner::after {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 40%;
            background: var(--accent);
            animation: slide 1100ms ease-in-out infinite;
        }

        @keyframes slide {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(250%);
            }
        }

        /* ---------------------------------------------------------------
           Responsive
           --------------------------------------------------------------- */
        @media (max-width: 1400px) {
            .content-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 1080px) {
            .header-inner {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .control-panel {
                flex-wrap: wrap;
            }

            .search-container {
                flex: 1 1 200px;
                width: auto;
            }

            .multiselect-container {
                left: 0;
                right: auto;
            }

            .content-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 620px) {
            .header-inner,
            .page-shell {
                padding-left: 16px;
                padding-right: 16px;
            }

            .site-description {
                display: none;
            }

            .filter-button,
            #date-jump {
                width: auto;
                flex: 1 1 130px;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="title-section">
                <h1 class="site-title">Git Miner</h1>
                <p class="site-description">Trending repositories on GitHub</p>
            </div>

            <div class="control-panel" aria-label="Repository filters">
                <div class="filter-item">
                    <label class="filter-label" for="date-jump">Time window</label>
                    <select id="date-jump">
                        <option value="day">Daily</option>
                        <option value="week">Weekly</option>
                        <option value="biweek">Bi-Weekly</option>
                        <option value="month">Monthly</option>
                        <option value="trimonth">Tri-Monthly</option>
                        <option value="halfyear">Half-Yearly</option>
                        <option value="year">Yearly</option>
                        <option value="biyear">Bi-Yearly</option>
                        <option value="triyear">Tri-Yearly</option>
                    </select>
                </div>

                <div class="filter-item">
                    <span class="filter-label" id="language-filter-label">Languages</span>
                    <button type="button" class="filter-button" id="language-filter-button" aria-labelledby="language-filter-label" aria-expanded="false">
                        <span>All Languages</span>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <ul class="multiselect-container hidden" id="language-filter-dropdown" role="menu">
                        <!-- Options will be added here -->
                    </ul>
                </div>

                <div class="filter-item search-container">
                    <label class="filter-label" for="search-query">Search</label>
                    <i class="search-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                            <circle cx="7" cy="7" r="4.25" />
                            <path d="M10.2 10.2 14 14" />
                        </svg>
                    </i>
                    <input id="search-query" type="text" class="search-input" placeholder="Search repositories…" autocomplete="off" />
                    <button type="button" class="search-clear hidden" id="search-clear" aria-label="Clear search" title="Clear search (Esc)">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                            <path d="M4 4l8 8M12 4l-8 8" />
                        </svg>
                    </button>
                </div>

                <button type="button" class="theme-toggle" id="theme-toggle">
                    <svg class="theme-icon theme-icon--light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                        <circle cx="8" cy="8" r="3.25" />
                        <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M12.95 3.05l-1.06 1.06M4.11 11.89l-1.06 1.06" />
                    </svg>
                    <svg class="theme-icon theme-icon--dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M13.5 9.7A5.9 5.9 0 0 1 6.3 2.5a5.9 5.9 0 1 0 7.2 7.2z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="page-shell">
        <main class="main-content" aria-live="polite">
            <!-- Repositories will be added here -->
        </main>

        <div class="loading-more hidden">
            <div class="spinner" aria-hidden="true"></div>
            <span>Mining repositories</span>
        </div>
    </div>
</body>

</html>
