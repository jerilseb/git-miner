<!doctype html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Miner</title>

    <!-- Loaded in <head> on purpose: the top of app.js applies the saved
         theme before the body is parsed. The rest of it waits for
         DOMContentLoaded, so nothing here touches the body early. -->
    <script src="assets/js/app.js"></script>

    <style>
        /* ---------------------------------------------------------------
           Tokens
           --------------------------------------------------------------- */
        /* Every colour is light-dark(light, dark) and resolves against the
           used color-scheme below, so the palette is defined exactly once. */
        :root {
            color-scheme: light dark;

            --radius: 2px;
            /* Drag-adjustable; app.js overrides this on <html> when resized. */
            --rail-width: 440px;

            --bg: light-dark(#f7f7f8, #0d0d10);
            --surface: light-dark(#ffffff, #141417);
            --surface-sunken: light-dark(#f2f2f4, #1a1a1e);
            --border: light-dark(#e3e3e7, #26262b);
            --border-strong: light-dark(#c9c9cf, #3d3d45);
            --text: light-dark(#17171a, #ececf0);
            --text-soft: light-dark(#52525b, #b7b7be);
            --muted: light-dark(#78787f, #85858f);
            --accent: light-dark(#1f5fd8, #6d9eff);
            --accent-soft: light-dark(#e8effc, #17233c);
            --star: light-dark(#a05a00, #d9a13b);
            --danger: light-dark(#b42318, #f97066);
        }

        /* data-theme is set on <html> before the body is painted; it pins the
           scheme, which also themes native widgets and scrollbars. The bare
           :root above only applies until then, so it follows the OS. */
        :root[data-theme="light"] {
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
        }

        /* ---------------------------------------------------------------
           Reset
           --------------------------------------------------------------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        h1,
        h2,
        p,
        ul,
        li {
            margin: 0;
            padding: 0;
        }

        ul,
        li {
            list-style: none;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            margin: 0;
            font: inherit;
            color: inherit;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter,
                "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .hidden {
            display: none !important;
        }

        /* ---------------------------------------------------------------
           Toolbar
           --------------------------------------------------------------- */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 32px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 14px 24px;
        }

        .title-section {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .site-title {
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .site-description {
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .filter-item {
            position: relative;
            min-width: 0;
        }

        .filter-label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .filter-button,
        .search-input,
        #date-jump {
            height: 34px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            transition: border-color 120ms linear, background-color 120ms linear;
        }

        .filter-button:hover,
        .search-input:hover,
        #date-jump:hover {
            border-color: var(--border-strong);
        }

        .filter-button:focus-visible,
        .search-input:focus,
        #date-jump:focus-visible {
            border-color: var(--accent);
        }

        #date-jump {
            appearance: none;
            width: 148px;
            padding-right: 26px;
            background-image:
                linear-gradient(45deg, transparent 50%, currentColor 50%),
                linear-gradient(135deg, currentColor 50%, transparent 50%);
            background-position: calc(100% - 14px) 15px, calc(100% - 10px) 15px;
            background-size: 4px 4px, 4px 4px;
            background-repeat: no-repeat;
            cursor: pointer;
        }

        #date-jump option {
            background: var(--surface);
            color: var(--text);
        }

        .filter-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 190px;
            cursor: pointer;
            text-align: left;
        }

        #language-filter-button span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chevron {
            width: 14px;
            height: 14px;
            flex: 0 0 auto;
            color: var(--muted);
            transition: transform 120ms linear;
        }

        #language-filter-button[aria-expanded="true"] .chevron {
            transform: rotate(180deg);
        }

        .search-container {
            width: 260px;
        }

        .search-input {
            width: 100%;
            padding-left: 32px;
            padding-right: 30px;
        }

        .search-input::placeholder {
            color: var(--muted);
        }

        .search-clear {
            position: absolute;
            top: 50%;
            right: 1px;
            display: grid;
            place-items: center;
            width: 28px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: var(--radius);
            background: none;
            color: var(--muted);
            cursor: pointer;
            transform: translateY(-50%);
            transition: color 120ms linear, background-color 120ms linear;
        }

        .search-clear:hover {
            background: var(--surface-sunken);
            color: var(--text);
        }

        .search-clear:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: -1px;
        }

        .search-clear svg {
            width: 13px;
            height: 13px;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 10px;
            display: grid;
            place-items: center;
            width: 14px;
            height: 14px;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .search-icon svg {
            width: 14px;
            height: 14px;
        }

        /* ---------------------------------------------------------------
           Theme toggle
           --------------------------------------------------------------- */
        .theme-toggle {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            background: var(--surface);
            color: var(--text-soft);
            cursor: pointer;
            transition: border-color 120ms linear, color 120ms linear;
        }

        .theme-toggle:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        .theme-toggle:focus-visible {
            border-color: var(--accent);
        }

        .theme-toggle svg {
            width: 15px;
            height: 15px;
        }

        /* The active icon is chosen in CSS so it is already correct on the
           first paint, before any script has run. */
        .theme-icon {
            display: none;
        }

        :root[data-theme="light"] .theme-icon--light,
        :root[data-theme="dark"] .theme-icon--dark {
            display: block;
        }

        /* ---------------------------------------------------------------
           Language multiselect
           --------------------------------------------------------------- */
        .multiselect-container {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 40;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1px;
            width: min(360px, calc(100vw - 48px));
            max-height: 320px;
            overflow-y: auto;
            padding: 6px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            background: var(--surface);
            scrollbar-width: thin;
        }

        .multiselect-container::-webkit-scrollbar {
            width: 8px;
        }

        .multiselect-container::-webkit-scrollbar-thumb {
            background: var(--border-strong);
        }

        .language-option {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            padding: 6px 8px;
            border-radius: var(--radius);
            color: var(--text-soft);
            font-size: 13px;
            cursor: pointer;
            transition: background-color 120ms linear, color 120ms linear;
        }

        .language-option:hover {
            background: var(--surface-sunken);
            color: var(--text);
        }

        .language-option:has(input:checked) {
            color: var(--text);
            font-weight: 500;
        }

        .multiselect-container input {
            appearance: none;
            display: grid;
            place-items: center;
            width: 14px;
            height: 14px;
            flex: 0 0 auto;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            background: var(--surface);
            cursor: pointer;
        }

        .multiselect-container input:checked {
            border-color: var(--accent);
            background: var(--accent);
        }

        .multiselect-container input:checked::before {
            content: "";
            width: 7px;
            height: 4px;
            border: solid var(--surface);
            border-width: 0 0 1.5px 1.5px;
            transform: rotate(-45deg) translate(0.5px, -1px);
        }

        /* ---------------------------------------------------------------
           Content
           --------------------------------------------------------------- */
        .page-shell {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 28px 24px 64px;
        }

        .content-batch + .content-batch {
            margin-top: 36px;
        }

        .date-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .date-head::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--border);
        }

        .date-pill {
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .batch-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 1px var(--rail-width);
            gap: 20px;
            align-items: start;
        }

        /* The divider is the drag handle. It stays 1px in the layout; the hit
           area is widened by the ::after overlay so it is grabbable. */
        .batch-resizer {
            position: relative;
            align-self: stretch;
            background: var(--border);
            cursor: col-resize;
            touch-action: none;
        }

        .batch-resizer::after {
            content: "";
            position: absolute;
            inset: 0 -8px;
        }

        .batch-resizer:hover,
        .batch-resizer:focus-visible {
            background: var(--accent);
            outline: none;
        }

        body.is-resizing {
            cursor: col-resize;
            user-select: none;
        }

        /* auto-fill rather than a fixed count: the column count then follows the
           grid's own width, so dragging the divider reflows it like a resize.
           The track minimum never drops below a third of the grid, which caps
           the layout at 3 columns however wide it gets; the 1px keeps the
           division just under an exact third so it can't round down to 2. */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(max(240px, calc((100% - 24px) / 3 - 1px)), 1fr));
            gap: 12px;
        }

        /* ---------------------------------------------------------------
           Hacker News rail
           --------------------------------------------------------------- */
        .hn-rail {
            min-width: 0;
        }

        .rail-head {
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .hn-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .hn-item {
            /* The comment icon has to match the title's first line box, so both
               of them read these metrics rather than repeating the numbers. */
            --hn-title-size: 13px;
            --hn-title-line: 1.4;
            min-width: 0;
        }

        .hn-item__head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .hn-item__title {
            flex: 1;
            min-width: 0;
            display: block;
            color: var(--text);
            font-size: var(--hn-title-size);
            font-weight: 500;
            line-height: var(--hn-title-line);
        }

        .hn-item__title:hover {
            color: var(--accent);
        }

        .hn-item__title:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: 2px;
        }

        .hn-item__meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
        }

        .hn-points {
            color: var(--star);
            font-weight: 600;
        }

        .hn-domain {
            min-width: 0;
            max-width: 190px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hn-comments {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: calc(var(--hn-title-size) * var(--hn-title-line));
            color: var(--muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        .hn-comments svg {
            width: 13px;
            height: 13px;
        }

        .hn-comments span {
            min-width: 3ch;
            text-align: right;
        }

        .hn-comments:hover {
            color: var(--accent);
        }

        .rail-note {
            color: var(--muted);
            font-size: 12px;
        }

        .repo-card {
            display: flex;
            flex-direction: column;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            transition: border-color 120ms linear;
        }

        .repo-card:hover {
            border-color: var(--border-strong);
        }

        .repo-card:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: -1px;
        }

        .repo-card__top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .owner-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .avatar-img {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            object-fit: cover;
            background: var(--surface-sunken);
        }

        .owner-pill span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .external-link {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 12px;
            opacity: 0;
            transition: opacity 120ms linear;
        }

        .repo-card:hover .external-link {
            opacity: 1;
        }

        .repo-card__title {
            margin-bottom: 6px;
            overflow-wrap: anywhere;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            transition: color 120ms linear;
        }

        .repo-card:hover .repo-card__title {
            color: var(--accent);
        }

        .repo-description {
            display: -webkit-box;
            min-height: 4.2em;
            margin-bottom: 14px;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            color: var(--text-soft);
            font-size: 13px;
            line-height: 1.45;
        }

        .repo-card__meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .meta-pill--stars {
            color: var(--star);
            font-weight: 500;
        }

        .language-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: var(--radius);
            background: var(--language-color, #94a3b8);
        }

        /* ---------------------------------------------------------------
           Empty / error / loading
           --------------------------------------------------------------- */
        .no-results,
        .quote-item {
            margin: 0 auto;
            max-width: 520px;
            padding: 28px 24px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-soft);
            font-size: 13px;
            text-align: center;
        }

        .no-results,
        .quote-item {
            grid-column: 1 / -1;
        }

        .quote-item {
            margin-top: 48px;
        }

        .no-results strong,
        .quote-item strong {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        .error-quote strong {
            color: var(--danger);
        }

        .loading-more {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 28px auto 0;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .spinner {
            position: relative;
            width: 120px;
            height: 2px;
            overflow: hidden;
            background: var(--border);
        }

        .spinner::after {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 40%;
            background: var(--accent);
            animation: slide 1100ms ease-in-out infinite;
        }

        @keyframes slide {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(250%);
            }
        }

        /* ---------------------------------------------------------------
           Responsive
           --------------------------------------------------------------- */
        @media (max-width: 1080px) {
            .header-inner {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .control-panel {
                flex-wrap: wrap;
            }

            .search-container {
                flex: 1 1 200px;
                width: auto;
            }

            .multiselect-container {
                left: 0;
                right: auto;
            }

            /* Too narrow for a side rail: stack it under the grid, which also
               makes the drag handle meaningless. */
            .batch-body {
                grid-template-columns: minmax(0, 1fr);
                gap: 24px;
            }

            .batch-resizer {
                display: none;
            }

            .hn-rail {
                padding-top: 20px;
                border-top: 1px solid var(--border);
            }

            .hn-list {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px 20px;
            }
        }

        @media (max-width: 620px) {
            .header-inner,
            .page-shell {
                padding-left: 16px;
                padding-right: 16px;
            }

            .site-description {
                display: none;
            }

            .filter-button,
            #date-jump {
                width: auto;
                flex: 1 1 130px;
            }

            .hn-list {
                grid-template-columns: 1fr;
            }
        }

        /* Only this far down do two cards side by side stop being readable;
           kept separate from the 620px block so the header rules are unaffected. */
        @media (max-width: 540px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ---------------------------------------------------------------
           Comments panel
           --------------------------------------------------------------- */
        body.comments-open {
            overflow: hidden;
        }

        .comments-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
        }

        .comments-backdrop {
            position: absolute;
            inset: 0;
            background: light-dark(rgba(23, 23, 26, 0.32), rgba(0, 0, 0, 0.55));
        }

        /* The drawer stays pinned to the right edge; only its width moves, and
           the clamp keeps the bounds here so the handle's JS just stores a
           number it can hand back. */
        .comments-panel {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            width: clamp(340px, var(--comments-width, 680px), 60vw);
            background: var(--bg);
        }

        .comments-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        /* The drawer's left edge is its drag handle, built like the rail's
           divider: 1px in the layout, with the hit area widened by ::after.
           It replaces the panel's border, so it is always visible. */
        .comments-resize {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 1px;
            background: var(--border);
            cursor: col-resize;
            touch-action: none;
        }

        .comments-resize::after {
            content: "";
            position: absolute;
            inset: 0 -8px;
        }

        .comments-resize:hover,
        body.is-resizing .comments-resize {
            background: var(--accent);
        }

        /* Too narrow for a drawer beside the page, which also makes the handle
           meaningless: the same trade the rail makes at this width. */
        @media (max-width: 620px) {
            .comments-panel {
                width: 100%;
            }

            .comments-resize {
                display: none;
            }
        }

        .comments-head__text {
            min-width: 0;
        }

        .comments-title {
            display: block;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        a.comments-title[href]:hover {
            color: var(--accent);
        }

        .comments-subtitle {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
        }

        .comments-hn-link {
            color: var(--muted);
            text-decoration: underline;
            text-decoration-color: var(--border-strong);
            text-underline-offset: 2px;
        }

        .comments-hn-link:hover {
            color: var(--accent);
            text-decoration-color: var(--accent);
        }

        .comments-close {
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            flex: 0 0 auto;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--muted);
            cursor: pointer;
            transition: border-color 120ms linear, color 120ms linear;
        }

        .comments-close:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        .comments-close:focus-visible {
            border-color: var(--accent);
            outline: none;
        }

        .comments-close svg {
            width: 13px;
            height: 13px;
        }

        .comments-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 32px;
            scrollbar-width: thin;
        }

        .comments-loading {
            display: grid;
            place-items: center;
            padding: 56px 0;
        }

        .comment {
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }

        .comments-body > .comment + .comment {
            margin-top: 12px;
        }

        .comment__head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }

        .comment__author {
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .comment__time {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 12px;
        }

        .comment__text {
            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        .comment__text p {
            margin-bottom: 8px;
        }

        .comment__text p:last-child {
            margin-bottom: 0;
        }

        .comment__text a {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-color: var(--border-strong);
            text-underline-offset: 2px;
        }

        .comment__text a:hover {
            text-decoration-color: var(--accent);
        }

        .comment__text pre {
            margin: 8px 0;
            padding: 10px 12px;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-sunken);
        }

        .comment__text code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
        }

        .comment-replies-toggle {
            margin-top: 10px;
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-sunken);
            color: var(--text-soft);
            font-size: 12px;
            cursor: pointer;
            transition: border-color 120ms linear, color 120ms linear;
        }

        .comment-replies-toggle:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        .comment-replies-toggle:focus-visible {
            border-color: var(--accent);
            outline: none;
        }

        /* Replies drop the card chrome; the left rule carries the nesting. */
        .comment-children {
            margin-top: 14px;
            padding-left: 14px;
            border-left: 2px solid var(--border);
        }

        .comment-children .comment {
            padding: 0;
            border: 0;
            background: none;
        }

        .comment-children .comment + .comment {
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="title-section">
                <h1 class="site-title">Git Miner</h1>
                <p class="site-description">Trending repositories on GitHub</p>
            </div>

            <div class="control-panel" aria-label="Repository filters">
                <div class="filter-item">
                    <label class="filter-label" for="date-jump">Time window</label>
                    <select id="date-jump">
                        <option value="day">Daily</option>
                        <option value="biday">Every 2 days</option>
                        <option value="triday">Every 3 days</option>
                        <option value="week">Weekly</option>
                        <option value="biweek">Every 2 weeks</option>
                        <option value="month">Monthly</option>
                        <option value="trimonth">Every 3 months</option>
                        <option value="halfyear">Every 6 months</option>
                        <option value="year">Yearly</option>
                        <option value="biyear">Every 2 years</option>
                        <option value="triyear">Every 3 years</option>
                    </select>
                </div>

                <div class="filter-item">
                    <span class="filter-label" id="language-filter-label">Languages</span>
                    <button type="button" class="filter-button" id="language-filter-button" aria-labelledby="language-filter-label" aria-expanded="false">
                        <span>All Languages</span>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <ul class="multiselect-container hidden" id="language-filter-dropdown" role="menu">
                        <!-- Options will be added here -->
                    </ul>
                </div>

                <div class="filter-item search-container">
                    <label class="filter-label" for="search-query">Search</label>
                    <i class="search-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                            <circle cx="7" cy="7" r="4.25" />
                            <path d="M10.2 10.2 14 14" />
                        </svg>
                    </i>
                    <input id="search-query" type="text" class="search-input" placeholder="Search repositories…" autocomplete="off" />
                    <button type="button" class="search-clear hidden" id="search-clear" aria-label="Clear search" title="Clear search (Esc)">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                            <path d="M4 4l8 8M12 4l-8 8" />
                        </svg>
                    </button>
                </div>

                <button type="button" class="theme-toggle" id="theme-toggle">
                    <svg class="theme-icon theme-icon--light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                        <circle cx="8" cy="8" r="3.25" />
                        <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M12.95 3.05l-1.06 1.06M4.11 11.89l-1.06 1.06" />
                    </svg>
                    <svg class="theme-icon theme-icon--dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M13.5 9.7A5.9 5.9 0 0 1 6.3 2.5a5.9 5.9 0 1 0 7.2 7.2z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="page-shell">
        <main class="main-content" aria-live="polite">
            <!-- Repositories will be added here -->
        </main>

        <div class="loading-more hidden">
            <div class="spinner" aria-hidden="true"></div>
            <span>Mining repositories</span>
        </div>
    </div>

    <!-- Outside .main-content on purpose: a cache restore replaces that element's
         innerHTML wholesale and would take the panel with it. -->
    <div class="comments-overlay hidden" id="comments-overlay">
        <div class="comments-backdrop" id="comments-backdrop"></div>
        <aside class="comments-panel" role="dialog" aria-modal="true" aria-label="Hacker News comments">
            <header class="comments-head">
                <div class="comments-head__text">
                    <a class="comments-title" id="comments-title" target="_blank" rel="noopener noreferrer"></a>
                    <div class="comments-subtitle" id="comments-subtitle"></div>
                </div>
                <button type="button" class="comments-close" id="comments-close" aria-label="Close comments" title="Close (Esc)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                        <path d="M4 4l8 8M12 4l-8 8" />
                    </svg>
                </button>
            </header>
            <div class="comments-body" id="comments-body"></div>
            <div class="comments-resize" id="comments-resize" title="Drag to resize"></div>
        </aside>
    </div>
</body>

</html>
